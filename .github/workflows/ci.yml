name: Unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v3

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env

      - name: Check lock file
        run: poetry lock --check

      - name: Run code quality checks
        run: poetry run make check

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        pyspark-version: ["3.5.8", "4.0.2", "4.1.0"]
      fail-fast: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          python-version: ${{ matrix.python-version }}
          pyspark-version: ${{ matrix.pyspark-version }}

      - name: Run tests
        run: poetry run pytest tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          # Pin a version the `test` matrix also covers, so coverage is never
          # measured against a pyspark the suite is not otherwise run on.
          pyspark-version: "4.0.2"

      # Fails when coverage drops below the `fail_under` set in pyproject.toml.
      - name: Run tests with coverage
        run: poetry run make test

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-poetry-env
        with:
          with-docs: true

      - name: Check if documentation can be built
        run: poetry run mkdocs build -s
